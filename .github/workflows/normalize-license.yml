name: Normalize GPL text

on:
  push:
    branches:
      - agent/import-source-and-packaging
    paths:
      - .github/workflows/normalize-license.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-source-and-packaging
          fetch-depth: 0
      - name: Replace license with the verbatim GPL v2 text
        shell: bash
        run: |
          cp /usr/share/common-licenses/GPL-2 LICENSE
          git rm .github/workflows/normalize-license.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          git commit -m "Preserve verbatim GNU GPL version 2 text"
          git push origin HEAD:agent/import-source-and-packaging
