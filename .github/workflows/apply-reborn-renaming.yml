name: Apply pdfsandwich-reborn branding

on:
  push:
    branches:
      - update/full-runtime-bundle
    paths:
      - .github/workflows/apply-reborn-renaming.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply project branding
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          old_repo = "p4535992/pdfsandwich"
          new_repo = "p4535992/pdfsandwich-reborn"

          for raw in subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0"):
              if not raw:
                  continue
              path = Path(raw.decode())
              if path.as_posix() == ".github/workflows/apply-reborn-renaming.yml":
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, IsADirectoryError):
                  continue

              updated = text.replace(old_repo, new_repo)
              if path.name == "README.md":
                  updated = updated.replace("# pdfsandwich\n", "# pdfsandwich-reborn\n", 1)
                  updated = updated.replace(
                      "A maintained continuation and packaging workspace for **pdfsandwich**",
                      "A maintained continuation and packaging workspace named **pdfsandwich-reborn** for **pdfsandwich**",
                      1,
                  )
                  marker = "> This repository is not the original upstream project."
                  note = (
                      "> **Project naming:** `pdfsandwich-reborn` is the maintained project name. "
                      "The executable and native package remain `pdfsandwich` for compatibility.\n\n"
                  )
                  if note not in updated and marker in updated:
                      updated = updated.replace(marker, note + marker, 1)

              if updated != text:
                  path.write_text(updated, encoding="utf-8")
          PY

          git rm .github/workflows/apply-reborn-renaming.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rename project branding to pdfsandwich-reborn"
          git push origin HEAD:update/full-runtime-bundle
