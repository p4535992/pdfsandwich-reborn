name: Build packages

on:
  pull_request:
  push:
    branches:
      - main
      - 'update/**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debian:
    name: Debian and source packages
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Import upstream source when needed
        shell: bash
        run: |
          if [[ ! -f pdfsandwich.ml ]]; then
            bash scripts/import-upstream.sh
          fi

      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts dpkg-dev gawk make ocaml-nox perl \
            imagemagick ghostscript poppler-utils \
            tesseract-ocr tesseract-ocr-eng unpaper exactimage

      - name: Build and test
        shell: bash
        run: |
          chmod +x scripts/*.sh tests/*.sh contrib/*.sh debian/rules \
            configure changelog2deb.pl make_control.pl make_portfile.pl txt2man
          echo PREFIX=/usr > makefile.installprefix
          make clean
          make all
          ./pdfsandwich -version
          bash tests/dependency-checks.sh

      - name: Build source archive
        shell: bash
        run: bash scripts/make-source-tarball.sh artifacts

      - name: Build Debian package
        shell: bash
        run: |
          dpkg-buildpackage --no-sign --build=binary
          mkdir -p artifacts
          cp ../pdfsandwich_*.deb artifacts/
          cp ../pdfsandwich_*.buildinfo artifacts/ 2>/dev/null || true
          cp ../pdfsandwich_*.changes artifacts/ 2>/dev/null || true
          (cd artifacts && sha256sum *.deb > SHA256SUMS-debian)

      - name: Upload Debian artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfsandwich-debian
          path: artifacts/
          if-no-files-found: error

  rpm:
    name: Fedora RPM and source RPM
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install checkout prerequisites
        run: dnf install -y git-core tar gzip bzip2 curl findutils coreutils

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build and runtime dependencies
        run: |
          dnf install -y \
            gcc gawk make ocaml perl-interpreter rpm-build \
            ImageMagick ghostscript poppler-utils \
            tesseract tesseract-langpack-eng unpaper

      - name: Import upstream source when needed
        shell: bash
        run: |
          if [[ ! -f pdfsandwich.ml ]]; then
            bash scripts/import-upstream.sh
          fi

      - name: Build, test and create source archive
        shell: bash
        run: |
          chmod +x scripts/*.sh tests/*.sh contrib/*.sh \
            configure changelog2deb.pl make_control.pl make_portfile.pl txt2man
          echo PREFIX=/usr > makefile.installprefix
          make clean
          make all
          ./pdfsandwich -version
          bash tests/dependency-checks.sh
          bash scripts/make-source-tarball.sh artifacts

      - name: Build RPM and SRPM
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < pdfsandwich_version)"
          topdir="$PWD/rpmbuild"
          mkdir -p "$topdir"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cp "artifacts/pdfsandwich-${version}.tar.gz" "$topdir/SOURCES/"
          cp packaging/pdfsandwich.spec "$topdir/SPECS/"
          rpmbuild --define "_topdir $topdir" -ba "$topdir/SPECS/pdfsandwich.spec"
          find "$topdir/RPMS" "$topdir/SRPMS" -type f -name '*.rpm' -exec cp {} artifacts/ \;
          (cd artifacts && sha256sum *.rpm > SHA256SUMS-rpm)

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfsandwich-rpm
          path: artifacts/
          if-no-files-found: error

  full-runtime:
    name: Full integrated runtime image
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build full runtime image
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < pdfsandwich_version)"
          echo "PDFSANDWICH_VERSION=$version" >> "$GITHUB_ENV"
          docker build \
            --build-arg "PDFSANDWICH_VERSION=$version" \
            --tag "pdfsandwich-full:$version" \
            --file docker/full/Dockerfile \
            .

      - name: Verify incorporated tools
        shell: bash
        run: |
          docker run --rm --entrypoint /bin/bash \
            "pdfsandwich-full:${PDFSANDWICH_VERSION}" -euxo pipefail -c '
              for command in pdfsandwich convert identify gs pdfinfo pdfunite pdftoppm tesseract unpaper hocr2pdf; do
                command -v "$command"
              done
              if command -v magick >/dev/null 2>&1; then
                magick -version
              else
                convert -version
              fi
              test -x /usr/local/bin/pdfsandwich-full
              test -x /usr/local/libexec/pdfsandwich/convert-pdftoppm.sh
              pdfsandwich -version
              tesseract --list-langs | grep -Fx eng
              tesseract --list-langs | grep -Fx ita
              gs --version
              pdfinfo -v
              unpaper --version
            '

      - name: OCR smoke test
        shell: bash
        run: |
          test_dir="$RUNNER_TEMP/pdfsandwich-full-test"
          mkdir -p "$test_dir"
          cat > "$test_dir/input.ps" <<'POSTSCRIPT'
          %!PS-Adobe-3.0
          << /PageSize [595 842] >> setpagedevice
          /Helvetica-Bold findfont 48 scalefont setfont
          70 500 moveto
          (PDFSANDWICH OCR TEST) show
          showpage
          POSTSCRIPT

          docker run --rm --entrypoint /bin/bash \
            -v "$test_dir:/work" -w /work \
            "pdfsandwich-full:${PDFSANDWICH_VERSION}" \
            -euxo pipefail -c 'ps2pdf input.ps input.pdf'

          docker run --rm \
            -v "$test_dir:/work" -w /work \
            "pdfsandwich-full:${PDFSANDWICH_VERSION}" \
            -nopreproc -lang eng -o output.pdf input.pdf

          docker run --rm --entrypoint /bin/bash \
            -v "$test_dir:/work" -w /work \
            "pdfsandwich-full:${PDFSANDWICH_VERSION}" \
            -euxo pipefail -c '
              pdfinfo output.pdf
              pdftotext output.pdf - | tr "[:lower:]" "[:upper:]" | grep -F "PDFSANDWICH"
            '

      - name: Export image, manifests and licenses
        shell: bash
        run: |
          mkdir -p artifacts/license-export/project
          image_archive="pdfsandwich-full-${PDFSANDWICH_VERSION}-linux-amd64.docker.tar.gz"
          license_archive="pdfsandwich-full-${PDFSANDWICH_VERSION}-licenses.tar.gz"

          docker save "pdfsandwich-full:${PDFSANDWICH_VERSION}" | gzip -9 > "artifacts/$image_archive"

          container_id="$(docker create "pdfsandwich-full:${PDFSANDWICH_VERSION}")"
          trap 'docker rm -f "$container_id" >/dev/null 2>&1 || true' EXIT
          docker cp "$container_id:/opt/pdfsandwich/licenses/." artifacts/license-export/
          docker cp "$container_id:/opt/pdfsandwich/THIRD_PARTY_NOTICES.md" artifacts/license-export/
          docker cp "$container_id:/opt/pdfsandwich/project/." artifacts/license-export/project/
          docker rm "$container_id"
          trap - EXIT

          tar -czf "artifacts/$license_archive" -C artifacts/license-export .
          cp THIRD_PARTY_NOTICES.md artifacts/
          cp artifacts/license-export/installed-packages.tsv \
            "artifacts/pdfsandwich-full-${PDFSANDWICH_VERSION}-packages.tsv"
          rm -rf artifacts/license-export

          (cd artifacts && sha256sum \
            "$image_archive" \
            "$license_archive" \
            "pdfsandwich-full-${PDFSANDWICH_VERSION}-packages.tsv" \
            > SHA256SUMS-full)

      - name: Upload full runtime artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pdfsandwich-full-runtime
          path: artifacts/
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [debian, rpm, full-runtime]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-artifacts/* --generate-notes
